<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sheet Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.75);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top right, #1e293b, #090d16);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 32px; }
    .header { text-align: center; padding: 8px 0; }
    .header h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.3px; }
    .header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .card-highlight {
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 8px 28px rgba(245, 158, 11, 0.14);
    }
    .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; display: block; }
    .box-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; color: #e2e8f0; word-break: break-all; }
    .btn {
      border: none; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-sm { padding: 7px 11px; font-size: 0.78rem; flex-shrink: 0; }
    .btn-primary { background: var(--accent); color: #0f172a; width: 100%; margin-top: 12px; padding: 12px; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: rgba(56, 189, 248, 0.12); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row .btn { flex: 1; }
    .btn-open { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-open:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.28); color: #fff; }
    .btn-danger:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-success { background: var(--success); color: #06281e; }
    .btn-success:hover:not(:disabled) { background: #059669; color: #fff; }
    .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="text"] {
      width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 0.85rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .status {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 0.83rem; display: none; line-height: 1.4;
    }
    .status.ok { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .status.err { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .hidden { display: none !important; }
    .meta-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
    .acc-list { display: flex; flex-direction: column; gap: 10px; }
    .acc-item {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .acc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .acc-title { font-size: 0.86rem; font-weight: 600; color: #f1f5f9; }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .badge-new { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-saved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); cursor: pointer; }
    .check-row input { accent-color: var(--accent); width: 15px; height: 15px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .remark-edit-row { display: flex; gap: 6px; align-items: center; }
    .remark-edit-row input { flex: 1; padding: 8px 10px; font-size: 0.82rem; }
    .empty-note { font-size: 0.82rem; color: var(--muted); text-align: center; padding: 12px 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .section-head .label { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>📊 Google Sheet Manager</h2>
      <p>Excel Auto-Ledger Configuration</p>
    </div>

    <!-- 0. Pending Excel Import Remarks (Shown when a file has new Bank Accs) -->
    <div class="card card-highlight hidden" id="pendingCard">
      <div class="section-head">
        <span class="label" style="color: #fbbf24;" id="pendingSummary">📝 BANK ACC REMARKS</span>
      </div>
      <div class="acc-list" id="pendingAccList"></div>
      <div class="btn-row" style="margin-top: 14px;">
        <button class="btn btn-success" id="submitBatchBtn" onclick="submitBatchRemarks()">💾 Save & Import</button>
        <button class="btn btn-danger" id="discardBatchBtn" onclick="discardBatch()">🗑️ Cancel</button>
      </div>
      <div class="status" id="pendingStatusBox"></div>
    </div>

    <!-- 1. Service Account Email -->
    <div class="card">
      <span class="label">1. Share ပေးရမည့် Service Email (Editor)</span>
      <div class="box-row">
        <span class="mono" id="serviceEmail">Loading...</span>
        <button class="btn btn-sm btn-outline" onclick="copyEmail()">Copy</button>
      </div>
    </div>

    <!-- 2. Current Active Sheet -->
    <div class="card">
      <span class="label">2. လက်ရှိ ချိတ်ဆက်ထားသော Sheet ID</span>
      <div class="box-row">
        <span class="mono" id="activeSheetId">Loading...</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-open" id="openSheetBtn" onclick="openCurrentSheet()">🔗 Google Sheet ဖွင့်ကြည့်ရန်</button>
        <button class="btn btn-danger" id="disconnectBtn" onclick="disconnectSheet()">🔌 Disconnect</button>
      </div>
    </div>

    <!-- 3. Change Sheet ID -->
    <div class="card">
      <span class="label">3. Sheet အသစ် ပြောင်းချိတ်ရန်</span>
      <input type="text" id="newSheetInput" placeholder="Google Sheet Link သို့မဟုတ် ID ထည့်ပါ..." />
      <button class="btn btn-primary" id="saveBtn" onclick="updateSheet()">💾 Save & Connect Sheet</button>
      <div class="status" id="statusBox"></div>
    </div>

    <!-- 4. Saved Bank Remarks Manager (Collapsed behind button) -->
    <div class="card">
      <button class="btn btn-outline" id="toggleRemarksBtn" onclick="toggleRemarksPanel()" style="width: 100%; justify-content: space-between; padding: 12px 14px;">
        <span>🏷️ BANK ACC REMARKS</span>
        <span id="remarksChevron">▾</span>
      </button>

      <div class="hidden" id="remarksPanel" style="margin-top: 12px;">
        <div class="acc-list" id="savedRemarksList">
          <div class="empty-note">Loading...</div>
        </div>
        <div class="status" id="remarksStatusBox"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    let requestedBatchId = urlParams.get('batchId') || '';

    let currentId = '';
    let serviceEmail = '';
    let envConfigured = true;
    let activeBatch = null;
    let remarksLoaded = false;

    function showBoxStatus(boxId, type, msg) {
      const box = document.getElementById(boxId);
      box.className = `status ${type}`;
      box.textContent = msg;
    }

    function showStatus(type, msg) {
      showBoxStatus('statusBox', type, msg);
    }

    function updateSheetUI(sheetId, isEnvConfigured = true) {
      currentId = sheetId || '';
      envConfigured = isEnvConfigured;
      const sheetEl = document.getElementById('activeSheetId');
      const openBtn = document.getElementById('openSheetBtn');
      const disconnectBtn = document.getElementById('disconnectBtn');

      if (currentId) {
        sheetEl.textContent = currentId;
        openBtn.disabled = false;
        disconnectBtn.disabled = false;
      } else {
        sheetEl.textContent = envConfigured
          ? 'ချိတ်ဆက်ထားခြင်း မရှိပါ (Disconnected)'
          : 'Not configured (set SHEET_ID)';
        openBtn.disabled = true;
        disconnectBtn.disabled = true;
      }
    }

    function formatBankLabel(bank, accNo) {
      return accNo && accNo !== '0000' ? `${bank} — ${accNo}` : bank;
    }

    function renderPendingBatch(batch) {
      activeBatch = batch;
      const card = document.getElementById('pendingCard');
      const list = document.getElementById('pendingAccList');
      const summary = document.getElementById('pendingSummary');

      if (!batch || !batch.accounts || batch.accounts.length === 0) {
        card.classList.add('hidden');
        list.innerHTML = '';
        return;
      }

      card.classList.remove('hidden');
      summary.textContent = `📝 ${batch.targetTab} — BANK ACC REMARKS`;

      list.innerHTML = '';
      batch.accounts.forEach((acc, idx) => {
        const item = document.createElement('div');
        item.className = 'acc-item';

        const title = document.createElement('span');
        title.className = 'acc-title';
        title.textContent = formatBankLabel(acc.bank, acc.accNo);

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Acc No / Remark ထည့်ပါ...';
        input.value = acc.remark || '';
        input.dataset.batchAccIdx = String(idx);

        item.appendChild(title);
        item.appendChild(input);
        list.appendChild(item);
      });
    }

    function renderSavedRemarks(remarks) {
      const container = document.getElementById('savedRemarksList');
      container.innerHTML = '';

      if (!remarks || remarks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-note';
        empty.textContent = 'မှတ်ထားသော Bank Account မရှိသေးပါ။';
        container.appendChild(empty);
        return;
      }

      remarks.forEach((itemData) => {
        const item = document.createElement('div');
        item.className = 'acc-item';

        const title = document.createElement('span');
        title.className = 'acc-title';
        title.textContent = formatBankLabel(itemData.bank, itemData.accNo);

        const editRow = document.createElement('div');
        editRow.className = 'remark-edit-row';

        const input = document.createElement('input');
        input.type = 'text';
        input.value = itemData.remark || '';
        input.placeholder = 'Acc No / Remark...';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn btn-sm btn-outline';
        saveBtn.textContent = '💾 Save';
        saveBtn.onclick = () => updateSavedRemark(itemData.bank, itemData.accNo, input.value, saveBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm btn-danger';
        delBtn.textContent = '🗑️';
        delBtn.onclick = () => deleteSavedRemark(itemData.bank, itemData.accNo, delBtn);

        editRow.appendChild(input);
        editRow.appendChild(saveBtn);
        editRow.appendChild(delBtn);

        item.appendChild(title);
        item.appendChild(editRow);
        container.appendChild(item);
      });
    }

    async function loadPendingBatch(batchId) {
      try {
        const query = batchId ? `&batchId=${encodeURIComponent(batchId)}` : '';
        const res = await fetch(`/api/webhook?action=pending_batch${query}`);
        const data = await res.json();
        if (data.ok) {
          renderPendingBatch(data.batch);
        }
      } catch (e) {
        // Ignore if unconfigured
      }
    }

    async function toggleRemarksPanel() {
      const panel = document.getElementById('remarksPanel');
      const chevron = document.getElementById('remarksChevron');
      const isHidden = panel.classList.contains('hidden');

      if (isHidden) {
        panel.classList.remove('hidden');
        chevron.textContent = '▴';
        if (!remarksLoaded) {
          await loadSavedRemarks();
          remarksLoaded = true;
        }
      } else {
        panel.classList.add('hidden');
        chevron.textContent = '▾';
      }
    }

    async function loadSavedRemarks() {
      try {
        const res = await fetch('/api/webhook?action=remarks');
        const data = await res.json();
        if (data.ok) {
          renderSavedRemarks(data.remarks);
        }
      } catch (e) {
        document.getElementById('savedRemarksList').innerHTML = '<div class="empty-note">Error loading remarks</div>';
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/webhook?action=config');
        const data = await res.json();
        if (data.ok) {
          serviceEmail = data.serviceEmail;
          document.getElementById('serviceEmail').textContent = serviceEmail;
          updateSheetUI(data.activeSheetId, data.envConfigured !== false);

          const batchToLoad = requestedBatchId || data.latestPendingBatchId;
          if (batchToLoad) {
            await loadPendingBatch(batchToLoad);
          }
        }
      } catch (e) {
        document.getElementById('serviceEmail').textContent = 'Error loading';
      }
    }

    function copyEmail() {
      if (!serviceEmail) return;
      navigator.clipboard.writeText(serviceEmail);
      showStatus('ok', '✅ Service Email ကို Copy ကူးပြီးပါပြီ။ Sheet အသစ်ရဲ့ Share ထဲမှာ Editor ထည့်ပေးပါ။');
    }

    function openCurrentSheet() {
      if (!currentId) return;
      const url = `https://docs.google.com/spreadsheets/d/${currentId}`;
      if (tg) tg.openLink(url);
      else window.open(url, '_blank');
    }

    async function submitBatchRemarks() {
      if (!activeBatch) return;
      const remarksPayload = activeBatch.accounts.map((acc, idx) => {
        const inputEl = document.querySelector(`input[data-batch-acc-idx="${idx}"]`);
        return {
          bank: acc.bank,
          accNo: acc.accNo,
          remark: inputEl ? inputEl.value.trim() : '',
          saveForFuture: true,
        };
      });

      const submitBtn = document.getElementById('submitBatchBtn');
      const discardBtn = document.getElementById('discardBatchBtn');
      submitBtn.disabled = true;
      discardBtn.disabled = true;
      submitBtn.textContent = '⏳ သိမ်းဆည်းနေသည်...';

      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'submit_batch_remarks',
            batchId: activeBatch.batchId,
            remarks: remarksPayload,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          renderPendingBatch(null);
          if (data.remarks) {
            renderSavedRemarks(data.remarks);
            remarksLoaded = true;
          }
          showStatus('ok', `✅ [${data.targetTab}] ထဲသို့ စာရင်း (${data.insertedCount}) ကြောင်း သိမ်းပြီးပါပြီ။`);
          if (tg && requestedBatchId) {
            setTimeout(() => tg.close(), 1200);
          }
        } else {
          showBoxStatus('pendingStatusBox', 'err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        showBoxStatus('pendingStatusBox', 'err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        submitBtn.disabled = false;
        discardBtn.disabled = false;
        submitBtn.textContent = '💾 Save & Import';
      }
    }

    async function discardBatch() {
      if (!activeBatch) return;
      const discardBtn = document.getElementById('discardBatchBtn');
      discardBtn.disabled = true;
      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'discard_batch', batchId: activeBatch.batchId }),
        });
        const data = await res.json();
        if (data.ok) {
          renderPendingBatch(null);
          showStatus('ok', '🗑️ Pending Excel စာရင်းကို ပယ်ဖျက်လိုက်ပါပြီ။');
        } else {
          showBoxStatus('pendingStatusBox', 'err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        showBoxStatus('pendingStatusBox', 'err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        discardBtn.disabled = false;
      }
    }

    async function updateSavedRemark(bank, accNo, remark, btn) {
      const cleanRemark = String(remark || '').trim();
      if (!cleanRemark) {
        showBoxStatus('remarksStatusBox', 'err', '⚠️ Remark ဗလာ ထား၍မရပါ။ ဖျက်လိုပါက 🗑️ ကိုနှိပ်ပါ။');
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'upsert_remark', bank, accNo, remark: cleanRemark }),
        });
        const data = await res.json();
        if (data.ok) {
          renderSavedRemarks(data.remarks);
          showBoxStatus('remarksStatusBox', 'ok', `✅ ${bank} (${accNo}) ၏ Remark ကို ပြင်ဆင်ပြီးပါပြီ။`);
        } else {
          showBoxStatus('remarksStatusBox', 'err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        showBoxStatus('remarksStatusBox', 'err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteSavedRemark(bank, accNo, btn) {
      btn.disabled = true;
      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete_remark', bank, accNo }),
        });
        const data = await res.json();
        if (data.ok) {
          renderSavedRemarks(data.remarks);
          showBoxStatus('remarksStatusBox', 'ok', `🗑️ ${bank} (${accNo}) ကို ဖျက်ပြီးပါပြီ။`);
        } else {
          showBoxStatus('remarksStatusBox', 'err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        showBoxStatus('remarksStatusBox', 'err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        btn.disabled = false;
      }
    }

    async function disconnectSheet() {
      if (!currentId) return;
      const btn = document.getElementById('disconnectBtn');
      btn.disabled = true;
      btn.textContent = '⏳ ဖြုတ်နေသည်...';

      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'disconnect_sheet' })
        });
        const data = await res.json();
        if (data.ok) {
          updateSheetUI('', true);
          showStatus('ok', '✅ Google Sheet ချိတ်ဆက်မှုကို Disconnect လုပ်ပြီးပါပြီ။');
        } else {
          btn.disabled = false;
          showStatus('err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        btn.disabled = false;
        showStatus('err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        btn.textContent = '🔌 Disconnect';
      }
    }

    async function updateSheet() {
      const input = document.getElementById('newSheetInput').value.trim();
      if (!input) {
        showStatus('err', '⚠️ Google Sheet Link သို့မဟုတ် ID အရင်ထည့်ပါ။');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '⏳ စစ်ဆေးနေပါသည်...';

      try {
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update_sheet', sheetInput: input })
        });
        const data = await res.json();
        if (data.ok) {
          updateSheetUI(data.activeSheetId, true);
          document.getElementById('newSheetInput').value = '';
          showStatus('ok', '✅ အောင်မြင်ပါသည်။ Deposit နှင့် Withdraw Tab များ အဆင်သင့် ပြင်ဆင်ပြီးပါပြီ။');
        } else {
          showStatus('err', `⚠️ ${data.error}`);
        }
      } catch (e) {
        showStatus('err', '⚠️ ချိတ်ဆက်မှု အမှားအယွင်း ဖြစ်ပေါ်နေပါသည်။');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save & Connect Sheet';
      }
    }

    loadConfig();
  </script>
</body>
</html>
